<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TV Player</title>
    <!-- app.css primero (tokens y sistema de diseno). tv.css ultimo: aisla la TV -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/tv.css">
</head>
<body>
    <!-- Pantalla completa: SVG en linea, sin fuentes de iconos -->
    <button id="fsBtn" type="button" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
        </svg>
    </button>

    <!-- Capa de estado del reproductor (conexion y autorizacion) -->
    <div id="statusMsg" class="tv-status is-connecting">
        <img class="tv-status__logo" src="img/imagotipo.png" alt="FarmaVid">
        <h1 id="statusTitle" class="tv-status__title">Conectando...</h1>
        <p id="statusDesc" class="tv-status__desc">...</p>
        <!-- ID del dispositivo: el operador lo lee desde lejos para autorizar -->
        <div id="statusId" class="tv-status__id is-hidden">
            <span class="tv-status__id-label">ID del dispositivo</span>
            <span id="statusIdValue"></span>
        </div>
    </div>

    <!-- Contenedor Doble Buffer Generico (divs que pueden tener img o video dentro) -->
    <div id="displayContainer" class="slide-container">
        <!-- Slot A -->
        <div id="slot0" class="slide-item"></div>
        <!-- Slot B -->
        <div id="slot1" class="slide-item"></div>
    </div>

    <!-- Consola de depuracion: oculta por defecto, el JS la muestra con .is-visible -->
    <div id="debugConsole" class="tv-debug"></div>

    <script src="js/socket.io.js" onerror="console.error('Failed to load socket.io.js'); if(document.getElementById('debugConsole')) document.getElementById('debugConsole').innerHTML += '<div>[ERROR] Failed to load js/socket.io.js</div>'"></script>
    <script>
        // Logger
        const debugConsole = document.getElementById('debugConsole');
        function log(msg) {
            console.log(msg);
            if (debugConsole) {
                const line = document.createElement('div');
                line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                debugConsole.appendChild(line);
                debugConsole.scrollTop = debugConsole.scrollHeight;
            }
        }
        window.onerror = function(msg, url, line) {
            log(`ERROR: ${msg} (${url}:${line})`);
        };

        // Declarar elementos UI AL INICIO
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const statusMsg = document.getElementById('statusMsg');
        const statusId = document.getElementById('statusId');
        const statusIdValue = document.getElementById('statusIdValue');

        // Capa de estado: unico punto de entrada para pintar el estado.
        // state: connecting | connected | disconnected | error | denied | waiting | syncing | empty
        //
        // OJO: setStatus NO cambia la visibilidad de la capa. Se muestra con
        // showStatus() y se oculta con hideStatus(). Si setStatus mostrara siempre
        // la capa, un corte de red momentaneo taparia el contenido que ya se esta
        // reproduciendo: el original mantenia la capa oculta a proposito para que
        // la TV siguiera pasando publicidad con lo que tuviera cacheado.
        function setStatus(state, title, desc, deviceId) {
            if (!statusMsg) return;
            var estabaOculto = statusMsg.classList.contains('is-hidden');
            statusMsg.className = 'tv-status is-' + state;
            if (estabaOculto) statusMsg.classList.add('is-hidden');
            if (statusTitle && title !== undefined) statusTitle.innerText = title;
            if (statusDesc && desc !== undefined) statusDesc.innerText = desc;
            if (statusIdValue && deviceId !== undefined) statusIdValue.innerText = deviceId;
            if (statusId) statusId.classList.toggle('is-hidden', deviceId === undefined);
        }

        // Muestra la capa de estado. Equivale al statusMsg.style.display = 'block' original.
        function showStatus() {
            if (statusMsg) statusMsg.classList.remove('is-hidden');
        }

        // Oculta la capa de estado. Solo como interlock de reproduccion:
        // misma posicion y condiciones que el display = 'none' original.
        function hideStatus() {
            if (statusMsg) statusMsg.classList.add('is-hidden');
        }

        // Variables Globales
        let currentPlaylist = [];
        let currentIndex = 0;
        let rotationTimer = null;
        let isAuthorized = false;
        
        // --- OFFLINE MODE IMPORTS ---
        // Simular Capacitor si no existe para evitar errores en web
        const Capacitor = window.Capacitor || { isNativePlatform: () => false };
        const Filesystem = window.Capacitor?.Plugins?.Filesystem;
        const Http = window.Capacitor?.Plugins?.Http;

        // Configuración Servidor
        // Si es nativo, usar URL absoluta. Si es web, usar relativa.
        const SERVER_URL = Capacitor.isNativePlatform() ? 'https://tv.farmavid.com.ve' : '';
        
        setStatus('connecting', 'Conectando...', 'Intentando conectar a: ' + (SERVER_URL || 'Localhost'));
        log("Iniciando Socket.io a: " + SERVER_URL);
        
        const socket = io(SERVER_URL, {
            reconnection: true,
            reconnectionDelay: 5000,
            reconnectionAttempts: Infinity,
            transports: ['websocket'], // Forzar solo Websocket para evitar problemas de polling/cors
            forceNew: true
        });
        
        socket.on('connect_error', (err) => {
            log('Connection Error: ' + err.message);
            console.error('Connection Error:', err);
            
            // Si hay error, mostrar consola para ver qué pasa
            if (debugConsole) debugConsole.classList.add('is-visible');

            setStatus('error', 'Error de Conexión', `No se pudo conectar al servidor.\n${err.message}`);
        });

        socket.on('disconnect', (reason) => {
            log('Desconectado: ' + reason);
            setStatus('disconnected', 'Desconectado');
        });
        
        // GESTIÓN DE ID DE PANTALLA PERSISTENTE (ID ESTABLE)
        // El ID debe permanecer SIEMPRE igual: si la TV se reinicia o se corta la luz,
        // reconecta con el MISMO ID y vuelve a aparecer como la misma pantalla pendiente.
        // 1. Buscar en URL (?id=...) - prioridad máxima.
        const params = new URLSearchParams(window.location.search);
        let myScreenId = params.get('id');

        // 2. Si no hay en URL, buscar en LocalStorage (ID ya registrado antes).
        if (!myScreenId) {
            myScreenId = localStorage.getItem('tv_device_id');
        }

        // 3. Si no hay en ninguno, generar uno nuevo aleatorio.
        if (!myScreenId) {
            myScreenId = 'TV-' + Math.floor(Math.random() * 10000);
        }

        // Persistimos SIEMPRE el ID resuelto, incluso si todavía NO está autorizada.
        // Esto lo deja clavado en el dispositivo y sobrevive a reinicios y recargas.
        localStorage.setItem('tv_device_id', myScreenId);

        // Variable para controlar si guardamos el ID
        let currentIdIsSaved = !!localStorage.getItem('tv_device_id');
        
        // Slots
        const slots = [document.getElementById('slot0'), document.getElementById('slot1')];
        let currentSlotIndex = 0;

        // Fullscreen
        const fsBtn = document.getElementById('fsBtn');
        if (Capacitor.isNativePlatform()) fsBtn.style.display = 'none'; // Ocultar en TV nativo

        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>console.log(e));
            else if (document.exitFullscreen) document.exitFullscreen();
        });
        document.addEventListener('fullscreenchange', () => {
            fsBtn.style.display = document.fullscreenElement ? 'none' : 'block';
            document.body.style.cursor = document.fullscreenElement ? 'none' : 'default';
        });

        // Socket
        socket.on('connect', () => {
            log('Socket conectado!');
            setStatus('connected', 'Conectado', `ID: ${myScreenId}`);
            
            const isApk = Capacitor.isNativePlatform(); // Usar API real
            socket.emit('register_screen', { screenId: myScreenId, isApk });
        });

        socket.on('authorization_change', (data) => {
            log('Auth change: ' + data.authorized);
            isAuthorized = data.authorized;
            
            // Controlar visibilidad de consola: Solo visible si NO está autorizado
            if (debugConsole) {
                debugConsole.classList.toggle('is-visible', !isAuthorized);
            }

            if (isAuthorized) {
                // ¡AUTORIZADA! -> Guardar ID para siempre
                localStorage.setItem('tv_device_id', myScreenId);
                currentIdIsSaved = true;

                setStatus('waiting', 'Esperando contenido...');
                resetSlots();
                showStatus();
            } else {
                // NO AUTORIZADA
                // El ID se mantiene persistido AUNQUE no esté autorizada.
                // Así, al reiniciar o cortar la luz, la TV vuelve a pedir aprobación
                // con el MISMO ID en vez de aparecer como una pantalla nueva.

                clearTimeout(rotationTimer);
                resetSlots();
                setStatus('denied', 'No Autorizada', 'Esta pantalla todavía no fue autorizada. Ingresa el siguiente código en el panel de administración.', myScreenId);
                showStatus();
            }
        });

        socket.on('update_playlist', async (data) => {
            log('Playlist recibida');
            if (!isAuthorized) return;
            
            // Soporte para nuevo formato { playlist, restart } o antiguo (array directo)
            let newPlaylist = [];
            let shouldRestart = true;

            if (Array.isArray(data)) {
                newPlaylist = data;
            } else if (data && data.playlist) {
                newPlaylist = data.playlist;
                if (data.restart !== undefined) shouldRestart = data.restart;
            }

            // --- DOWNLOAD MANAGER (Offline Mode) ---
            if (Capacitor.isNativePlatform()) {
                setStatus('syncing', 'Sincronizando...', 'Verificando archivos...');
                showStatus();
                
                try {
                    // Descargar contenido
                    newPlaylist = await syncContent(newPlaylist);
                    hideStatus();
                } catch (e) {
                    console.error("Error sync:", e);
                    setStatus('error', 'Error descargando contenido', 'Se reproducirá el contenido disponible.');
                    // Intentar reproducir con lo que haya
                }
            }

            currentPlaylist = newPlaylist;
            
            if (shouldRestart) {
                currentIndex = 0;
                startPlayback();
            } else {
                if (currentIndex >= currentPlaylist.length) {
                    currentIndex = 0;
                    startPlayback();
                }
            }
        });

        async function syncContent(playlist) {
            if (!Filesystem || !Http) return playlist;
            
            // Crear directorio media si no existe
            try { await Filesystem.mkdir({ path: 'media', directory: 'DATA', recursive: true }); } catch(e) {}

            const finalPlaylist = [];
            const filesToKeep = new Set();
            
            // ... resto del codigo ...
            for (let i = 0; i < playlist.length; i++) {
                const item = playlist[i];
                const filename = item.url.split('/').pop(); // Extraer nombre archivo
                const localPath = `media/${filename}`; // Carpeta 'media' en DATA
                
                filesToKeep.add(filename);

                try {
                    // Verificar si existe
                    await Filesystem.stat({
                        path: localPath,
                        directory: 'DATA'
                    });
                    
                    // Obtener URI local
                    const fileUri = await Filesystem.getUri({
                        path: localPath,
                        directory: 'DATA'
                    });
                    
                    const finalUrl = Capacitor.convertFileSrc(fileUri.uri);
                    log(`Cargando local: ${finalUrl}`);

                    finalPlaylist.push({
                        ...item,
                        url: finalUrl
                    });
                } catch (e) {
                    // No existe, descargar
                    setStatus('syncing', 'Sincronizando...', `Descargando ${i + 1}/${playlist.length}`);
                    log(`Descargando: ${item.url}`);
                    
                    try {
                        const downloadUrl = item.url.startsWith('http') ? item.url : SERVER_URL + item.url;
                        
                        await Http.downloadFile({
                            url: downloadUrl,
                            filePath: localPath,
                            fileDirectory: 'DATA'
                        });

                        const fileUri = await Filesystem.getUri({
                            path: localPath,
                            directory: 'DATA'
                        });

                        const finalUrl = Capacitor.convertFileSrc(fileUri.uri);
                        log(`Descarga ok, URL: ${finalUrl}`);

                        finalPlaylist.push({
                            ...item,
                            url: finalUrl
                        });
                    } catch (downloadError) {
                        console.error("Error bajando", item.url, downloadError);
                        log(`Error bajando: ${downloadError.message}`);
                        // Fallback a remoto absoluto
                        finalPlaylist.push({
                            ...item,
                            url: item.url.startsWith('http') ? item.url : SERVER_URL + item.url
                        });
                    }
                }
            }
            
            // LIMPIEZA
            await cleanupStorage(filesToKeep);
            
            return finalPlaylist;
        }

        async function cleanupStorage(validFiles) {
            try {
                const result = await Filesystem.readdir({
                    path: 'media',
                    directory: 'DATA'
                });
                
                // result.files es un array de objetos { name, type, ... } en versiones nuevas
                // o strings en viejas. Capacitor 5/6 usa objetos.
                const files = result.files.map(f => f.name || f);

                for (const fileName of files) {
                    if (!validFiles.has(fileName)) {
                        console.log("Borrando archivo obsoleto:", fileName);
                        await Filesystem.deleteFile({
                            path: `media/${fileName}`,
                            directory: 'DATA'
                        });
                    }
                }
            } catch (e) {
                console.warn("Error en limpieza (puede que esté vacío):", e);
            }
        }

        function resetSlots() {
            slots[0].className = 'slide-item';
            slots[0].innerHTML = '';
            slots[1].className = 'slide-item';
            slots[1].innerHTML = '';
        }

        function startPlayback() {
            if (rotationTimer) clearTimeout(rotationTimer);

            if (!currentPlaylist || currentPlaylist.length === 0) {
                resetSlots();
                setStatus('empty', 'Playlist Vacía');
                showStatus();
                return;
            }

            hideStatus();
            showCurrentItem();
        }

        function showCurrentItem() {
            if (currentPlaylist.length === 0) return;
            
            // Cancelar timer anterior por seguridad
            if (rotationTimer) clearTimeout(rotationTimer);
            
            const item = currentPlaylist[currentIndex];
            const nextSlotIndex = (currentSlotIndex + 1) % 2;
            const currentSlot = slots[currentSlotIndex];
            const nextSlot = slots[nextSlotIndex];

            // --- OPTIMIZACIÓN VIDEO ÚNICO ---
            // Si la playlist tiene solo 1 item y es video, usar loop nativo en el mismo slot
            // para evitar parpadeos o crashes al recrear el elemento constantemente.
            if (currentPlaylist.length === 1 && item.type === 'video') {
                // Verificar si ya estamos reproduciendo este video en el slot actual
                const existingVideo = currentSlot.querySelector('video');
                if (existingVideo && existingVideo.src.endsWith(item.url.split('/').pop())) {
                    // Ya está reproduciendo el mismo video. Asegurar loop y salir.
                    existingVideo.loop = true;
                    existingVideo.onended = null; // Quitar listener para que no salte
                    if (existingVideo.paused) existingVideo.play().catch(e => console.error(e));
                    return; 
                }
            }

            // Preparar contenido en el siguiente slot
            // IMPORTANTE: Limpiar bien el slot anterior para liberar memoria
            nextSlot.innerHTML = ''; 
            
            // Limpiar también el slot actual (que pasará a ser el "viejo") DESPUÉS de la transición
            // para evitar que se acumulen videos en memoria si el garbage collector es lento.
            // Pero no podemos borrarlo YA porque se tiene que ver durante la transición.
            // Lo haremos en el siguiente ciclo o con un timeout largo.
            
            let element;

            if (item.type === 'video') {
                element = document.createElement('video');
                element.src = item.url;
                element.muted = true;
                element.autoplay = true;
                element.playsInline = true;
                element.style.width = '100%';
                element.style.height = '100%';
                element.style.objectFit = 'contain';
                
                log(`Reproduciendo video: ${item.url}`);
                
                // Evento para cuando termine el video
                element.onended = () => {
                    log("Video terminó, siguiente...");
                    nextSlide();
                };
                
                // Fallback por si falla autoplay
                element.onerror = (e) => {
                    console.error("Error video", item.url, e);
                    log(`Error video: ${item.url}`);
                    setTimeout(nextSlide, 2000);
                };

                // Intentar reproducir explícitamente para capturar errores de políticas de autoplay
                // (Aunque autoplay=true suele bastar, en algunos TVs ayuda)
                element.play().catch(e => {
                    console.warn("Autoplay falló, intentando muteado", e);
                    element.muted = true;
                    element.play().catch(err => {
                        console.error("No se pudo reproducir video", err);
                        setTimeout(nextSlide, 3000); // Saltar si falla fatalmente
                    });
                });

            } else {
                element = document.createElement('img');
                element.src = item.url;
                element.style.width = '100%';
                element.style.height = '100%';
                element.style.objectFit = 'contain';
                
                log(`Mostrando imagen: ${item.url} (Dur: ${item.duration || 5000}ms)`);
                
                element.onerror = (e) => {
                     console.error("Error imagen", item.url, e);
                     log(`Error imagen: ${item.url}`);
                     setTimeout(nextSlide, 2000);
                };
            }
            
            nextSlot.appendChild(element);

            // Aplicar Transición
            const effect = item.transition || 'fade';
            
            // Limpiar clases anteriores y aplicar nuevas
            nextSlot.className = `slide-item effect-${effect}`;
            currentSlot.className = `slide-item effect-${effect} exit`;

            void nextSlot.offsetWidth; // Force reflow

            nextSlot.classList.add('active');
            currentSlot.classList.remove('active');
            
            // LIMPIEZA AGRESIVA DE RECURSOS DEL SLOT ANTERIOR (currentSlot)
            const oldVideo = currentSlot.querySelector('video');
            if (oldVideo) {
                setTimeout(() => {
                    oldVideo.pause();
                    oldVideo.src = "";
                    oldVideo.load();
                    currentSlot.innerHTML = '';
                }, 2000); 
            } else {
                 setTimeout(() => {
                    currentSlot.innerHTML = '';
                 }, 2000);
            }

            // Actualizar índice de slot
            currentSlotIndex = nextSlotIndex;

            // Programar siguiente (solo para imágenes, video se maneja por evento onended)
            if (item.type !== 'video') {
                const dur = parseInt(item.duration) || 5000;
                log(`Programando siguiente en ${dur}ms`);
                rotationTimer = setTimeout(() => {
                    nextSlide();
                }, dur);
            }
        }

        function nextSlide() {
            log("Siguiente slide...");
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            showCurrentItem();
        }
        // Heartbeat cada minuto
        setInterval(() => {
            if(socket && myScreenId) {
                socket.emit('heartbeat', myScreenId);
            }
        }, 60000);
    </script>
</body>
</html>
