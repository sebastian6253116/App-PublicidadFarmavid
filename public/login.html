<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso · FarmaVid</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="auth">
        <!-- Marca: logo horizontal + titulo en espanol -->
        <div class="auth__brand">
            <img class="auth__logo" src="img/logo.png" alt="FarmaVid">
            <h1 class="auth__title">Panel de Administración</h1>
            <p class="auth__subtitle text-muted">Ingresá con tu usuario para gestionar pantallas y contenido.</p>
        </div>

        <section class="card auth__card">
            <form id="loginForm" class="card__body">
                <!-- Region de error: vacia no ocupa espacio, se anuncia con role="alert" -->
                <div id="errorMsg" class="auth__alert" role="alert" aria-live="assertive"></div>

                <div class="field">
                    <label class="field__label" for="username">Usuario</label>
                    <input class="input" id="username" name="username" type="text"
                        autocomplete="username" autocapitalize="off" spellcheck="false"
                        placeholder="Tu usuario" required>
                </div>

                <div class="field">
                    <label class="field__label" for="password">Contraseña</label>
                    <div class="field__control">
                        <input class="input" id="password" name="password" type="password"
                            autocomplete="current-password" placeholder="Tu contraseña" required>
                        <button type="button" class="field__action" id="togglePassword"
                            aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
                            <!-- Icono ojo abierto (mostrar) -->
                            <svg id="iconShow" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <!-- Icono ojo tachado (ocultar) -->
                            <svg id="iconHide" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true" focusable="false" class="is-hidden">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--block btn--lg" id="submitBtn">
                    <span class="spinner spinner--sm" id="submitSpinner" aria-hidden="true" hidden></span>
                    <span id="submitLabel">Ingresar</span>
                </button>
            </form>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
